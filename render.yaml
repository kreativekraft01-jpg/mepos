services:
  - type: web
    name: mepos-pos-app
    env: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build && npm --prefix server install && npx --prefix server prisma generate && npm --prefix server run build
    startCommand: node server/dist/server.js
    autoDeploy: true
    previews:
      generation: automatic
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: DATABASE_URL
        sync: false
        # Set this in Render dashboard → Environment → Add DATABASE_URL
        # Free option: Neon (https://neon.tech) free 0.5GB Postgres → paste connection string here
        # Leave empty for local testing — server will use JSON file fallback (ephemeral on free, ok for public testing demo)
      - key: PORT
        value: 10000
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# To restore Master-local backup locally: git checkout Master-local
# To use static-only (no server) again, change env back to `static` and staticPublishPath to `dist`
