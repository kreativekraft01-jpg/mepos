services:
  - type: web
    name: mepos-pos-app
    env: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build && cd server && npm install && npx prisma generate && npm run build && cd .. && ls -la server/dist/ || true
    startCommand: node server/dist/server.js
    autoDeploy: true
    previews:
      generation: automatic
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: DATABASE_URL
        sync: false
        # Set this in Render dashboard → Environment → Add DATABASE_URL
        # Free option: Neon (https://neon.tech) free 0.5GB Postgres → paste connection string here
        # Leave empty for local testing — server will use JSON file fallback (ephemeral on free, ok for public testing demo)
      - key: JWT_SECRET
        sync: false
        # Generate: openssl rand -base64 32 — or set any long random string. Used to sign login tokens.
      - key: ADMIN_USERNAME
        sync: false
        # Default: admin — set to your desired login username
      - key: ADMIN_PASSWORD
        sync: false
        # Default: admin123 — set to your desired login password (stored hashed via bcrypt)
      - key: PORT
        value: 10000
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# To restore Master-local backup locally: git checkout Master-local
# To use static-only (no server) again, change env back to `static` and staticPublishPath to `dist`
